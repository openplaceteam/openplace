services:
  db:
    image: mariadb:12.0.2
    ports:
      - 3306:3306
    environment:
      - MARIADB_DATABASE=openplace
      - MARIADB_ROOT_PASSWORD=password
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
  app:
    image: node:22-alpine
    env_file: ./.env
    ports:
      - 3000:3000
    volumes:
      - .:/app
      - app_files:/app/files
      - /app/node_modules
    working_dir: /app
    command: sh -c "
      apk add --no-cache curl &&
      npm install &&
      npx prisma migrate deploy &&
      npx prisma generate &&
      npx prisma db push &&
      npm run dev
      "
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  db_data:
    driver: local
  app_files:
    driver: local
